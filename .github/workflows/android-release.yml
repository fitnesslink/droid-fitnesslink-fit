name: Android Release

# main      -> signed AAB to the Play internal testing track
# android/v* -> signed AAB to the closed testing track (alpha), after approval
#              in the play-closed environment
# Production promotion stays manual in Play Console.

on:
  push:
    branches: [main]
    tags: ['android/v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.fitnesslink.fit
  # Keeps CI versionCodes above anything uploaded by hand before CI existed.
  VERSION_CODE_OFFSET: 100

jobs:
  release:
    name: Build and upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/android/v') && 'play-closed' || 'play-internal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and track
        id: version
        run: |
          code=$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))
          if [[ "$GITHUB_REF" == refs/tags/android/v* ]]; then
            name="${GITHUB_REF#refs/tags/android/v}"
            track=alpha
          else
            name="1.0.0-build.${code}"
            track=internal
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "versionCode $code, versionName $name, track $track"

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_B64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.code }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        # v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ steps.version.outputs.track }}
          status: completed
